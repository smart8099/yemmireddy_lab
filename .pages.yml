# Pages CMS configuration — the admin panel at https://app.pagescms.org
#
# Each entry below is one form in the admin panel. Field names must match the
# schemas in src/content.config.ts; if you add a field there, add it here too.

media:
  input: src/assets/images
  # Content files live two folders below src/ (src/content/<type>/<file>), so
  # uploaded images are referenced relative to them. Astro then optimises them.
  output: ../../assets/images
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  # ------------------------------------------------------------------ People
  - name: people
    label: People (current members)
    description: One entry per current lab member. When someone graduates, add them to "Alumni" and delete them here.
    type: collection
    path: src/content/people
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: name
      fields: [name, role, position]
      sort: [order, name]
      default:
        sort: order
        order: asc
      search: [name, position]
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - name: honorific
        label: Degree suffix
        type: string
        description: e.g. "Ph.D." — leave blank for students.
      - name: role
        label: Group
        type: select
        required: true
        description: Decides which section of the People page they appear in.
        options:
          values:
            - Principal Investigator
            - Postdoctoral Researcher
            - Staff
            - Visiting Scholar
            - Graduate Student
            - Undergraduate Student
      - name: position
        label: Position / title
        type: text
        required: true
        description: Shown under the name. Use a new line for a second title.
      - name: order
        label: Sort order
        type: number
        description: Lower numbers appear first within their group (e.g. 1, 2, 3…).
      - name: photo
        label: Photo
        type: image
        description: A portrait photo works best (face near the top). JPG or PNG.
      - name: education
        label: Education
        type: string
        list: true
      - name: research_interests
        label: Research interests
        type: text
      - name: current_research
        label: Current research
        type: text
        list: true
        description: One project per item.
      - name: outside_the_lab
        label: Outside the lab
        type: text
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string, pattern: { regex: "^(https?://.*)?$", message: "Paste the full link starting with https://" } }
      - { name: google_scholar, label: Google Scholar URL, type: string, pattern: { regex: "^(https?://.*)?$", message: "Paste the full link starting with https://" } }
      - { name: website, label: Personal website URL, type: string, pattern: { regex: "^(https?://.*)?$", message: "Paste the full link starting with https://" } }

  # ------------------------------------------------------------------ Alumni
  - name: alumni
    label: Alumni
    type: file
    path: src/content/pages/alumni.yml
    fields:
      - name: graduate
        label: Graduate student alumni
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: degree, label: Degree and year, type: string, required: true, description: 'e.g. "MS in Biology, 2026"' }
          - { name: current_position, label: Current position, type: string }
      - name: undergraduate
        label: Undergraduate alumni
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: program, label: Program, type: string, description: 'e.g. "BS in Biology"' }

  # ------------------------------------------------------------------ News
  - name: news
    label: News
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Headline, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - name: summary
        label: Short summary
        type: text
        required: true
        description: One or two sentences shown on the news list and in search results.
      - { name: cover, label: Cover photo, type: image }
      - { name: cover_alt, label: Cover photo description, type: string, description: Describe the photo for people using screen readers. }
      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          creatable: true
          values: [Lab news, Award, Publication, Presentation, Outreach, Grant, Event]
      - { name: draft, label: Draft (hide from website), type: boolean, default: false }
      - { name: body, label: Story, type: rich-text }

  # ------------------------------------------------------------------ Publications
  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml
    filename: "{year}-{primary}.yml"
    view:
      primary: title
      fields: [title, year, venue]
      default:
        sort: year
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: Authors, type: text, required: true, description: 'As they appear on the paper, e.g. "Smith J, Yemmireddy VK"' }
      - { name: venue, label: Journal / book / conference, type: string }
      - { name: volume, label: Volume, type: string }
      - { name: issue, label: Issue, type: string }
      - { name: pages, label: Pages or article number, type: string }
      - { name: year, label: Year, type: number, required: true }
      - name: type
        label: Type
        type: select
        default: Journal article
        options:
          values: [Journal article, Book chapter, Conference, Extension publication, Report, Thesis, Other]
      - { name: doi, label: DOI, type: string, description: 'e.g. 10.1016/j.foodcont.2024.110000' }
      - { name: url, label: Link (if no DOI), type: string }

  # ------------------------------------------------------------------ Pages
  - name: home
    label: "Page: Home"
    type: file
    path: src/content/pages/home.yml
    fields:
      - { name: hero_title, label: Main heading, type: string, required: true }
      - { name: hero_subtitle, label: Tagline, type: string, required: true }
      - name: carousel
        label: Rotating photos
        type: object
        list: true
        description: Landscape photos work best. 3–5 photos is ideal.
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string, required: true, description: Describe the photo for screen readers. }
          - { name: caption, label: Caption (optional), type: string }
      - { name: intro, label: About the lab, type: text, required: true, description: Leave an empty line between paragraphs. }
      - { name: mission_title, label: Mission heading, type: string, required: true }
      - { name: mission, label: Mission statement, type: text, required: true, description: Each sentence becomes its own line. }
      - name: discovery
        label: '"From Discovery to Impact" graphic'
        type: object
        description: Edit the wording here; the graphic is drawn automatically.
        fields:
          - { name: eyebrow, label: Small label above title, type: string }
          - { name: title, label: Title, type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - name: stages
            label: Stages
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - name: icon
                label: Icon
                type: select
                options:
                  values: [understand, control, inform, empower, impact]
              - { name: points, label: Bullet points, type: string, list: true }
          - { name: explore_label, label: '"Explore the lab" label', type: string, description: Leave blank to hide the page-link icons. }
          - name: original_image
            label: Original graphic (shown below)
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: alt, label: Image description, type: text }
      - { name: join_title, label: '"Join the lab" heading', type: string, description: Leave blank to hide this section. }
      - { name: join_text, label: '"Join the lab" text', type: text }
      - { name: seo_title, label: Search engine title (optional), type: string }
      - { name: seo_description, label: Search engine description (optional), type: text }

  - name: research
    label: "Page: Research"
    type: file
    path: src/content/pages/research.yml
    fields:
      - { name: title, label: Page name, type: string, required: true }
      - { name: subtitle, label: Heading, type: string, required: true }
      - { name: intro, label: Introduction, type: text, required: true }
      - { name: directions, label: Research directions line, type: string }
      - { name: framework_title, label: Framework section heading, type: string }
      - name: framework
        label: Framework diagram (text)
        type: object
        description: The "From Insight to Impact" diagram. Edit the wording here; the layout is drawn automatically.
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: system_label, label: '"System we study" label', type: string }
          - { name: stages, label: Supply-chain stages, type: string, list: true }
          - { name: flow_note, label: Arrow text, type: string }
          - { name: core_label, label: Centre label, type: string }
          - { name: core_title, label: Centre title, type: string, required: true }
          - { name: core_note, label: Centre note, type: string }
          - name: areas
            label: Research areas (3)
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: title, label: Title, type: string, required: true }
              - { name: question, label: Guiding question, type: text }
          - { name: practice_label, label: '"Into practice" label', type: string }
          - { name: practice, label: Practice channels, type: string, list: true }
          - { name: impact_title, label: Impact heading, type: string }
          - { name: impact, label: Impact outcomes, type: string, list: true }
          - name: original_image
            label: Original graphic (shown below the diagram)
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: alt, label: Image description, type: text }
      - name: decision_cycle
        label: QMRA cycle diagram (text)
        type: object
        description: The "From Evidence to Decision" cycle shown in the Inform section. Works best with 5 steps.
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: hub_label, label: Centre label, type: string }
          - { name: hub_title, label: Centre title, type: string, required: true }
          - { name: hub_note, label: Centre note, type: string }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step title, type: string, required: true }
              - { name: details, label: Details, type: string, list: true }
          - { name: outcomes_label, label: Outcomes label, type: string }
          - { name: outcomes, label: Outcomes, type: string, list: true }
          - name: original_image
            label: Original graphic (shown below the diagram)
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: alt, label: Image description, type: text }
      - name: pillars
        label: Research areas
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true, description: 'e.g. "01 | Understand"' }
          - { name: title, label: Title, type: string, required: true }
          - { name: summary, label: Summary, type: text, required: true }
          - { name: show_decision_cycle, label: Show the QMRA cycle diagram here, type: boolean }
          - name: photos
            label: Photos
            type: object
            list: true
            fields:
              - { name: image, label: Photo, type: image, required: true }
              - { name: alt, label: Photo description, type: string, required: true }
      - { name: closing_title, label: Closing heading, type: string }
      - { name: closing_text, label: Closing text, type: text }
      - { name: seo_title, label: Search engine title (optional), type: string }
      - { name: seo_description, label: Search engine description (optional), type: text }

  - name: teaching
    label: "Page: Teaching"
    type: file
    path: src/content/pages/teaching.yml
    fields:
      - { name: title, label: Page name, type: string, required: true }
      - { name: subtitle, label: Heading, type: string, required: true }
      - { name: intro, label: Introduction, type: text, required: true }
      - name: feature_photo
        label: Main photo
        type: object
        fields:
          - { name: image, label: Photo, type: image }
          - { name: alt, label: Photo description, type: string }
      - { name: approach_title, label: Approach heading, type: string }
      - name: approach
        label: Teaching approach
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
      - { name: courses_title, label: Courses heading, type: string }
      - name: courses
        label: Courses
        type: object
        list: true
        fields:
          - { name: code, label: Course code, type: string, required: true }
          - { name: title, label: Course title, type: string, required: true }
          - { name: level, label: Level, type: string, description: 'e.g. "Undergraduate"' }
          - { name: description, label: Description (optional), type: text }
      - { name: gallery_title, label: Gallery heading, type: string }
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string, required: true }
      - { name: mentoring_title, label: Mentoring heading, type: string }
      - { name: mentoring_text, label: Mentoring text, type: text }
      - name: mentoring_photos
        label: Mentoring photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string, required: true }
      - { name: seo_title, label: Search engine title (optional), type: string }
      - { name: seo_description, label: Search engine description (optional), type: text }

  - name: outreach
    label: "Page: Training & Outreach"
    type: file
    path: src/content/pages/outreach.yml
    fields:
      - { name: title, label: Page name, type: string, required: true }
      - { name: subtitle, label: Heading, type: string, required: true }
      - { name: intro, label: Introduction, type: text, description: Leave an empty line between paragraphs. }
      - name: feature_photo
        label: Main image
        type: object
        fields:
          - { name: image, label: Image, type: image }
          - { name: alt, label: Image description, type: string }
      - name: highlights
        label: Highlights
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
      - { name: gallery_title, label: Gallery heading, type: string }
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Photo description, type: string, required: true }
          - { name: caption, label: Caption (optional), type: string }
      - { name: seo_title, label: Search engine title (optional), type: string }
      - { name: seo_description, label: Search engine description (optional), type: text }

  - name: publications_page
    label: "Page: Publications intro"
    type: file
    path: src/content/pages/publications.yml
    fields:
      - { name: title, label: Page name, type: string, required: true }
      - { name: intro, label: Introduction, type: text }
      - { name: seo_title, label: Search engine title (optional), type: string }
      - { name: seo_description, label: Search engine description (optional), type: text }

  # ------------------------------------------------------------------ Settings
  - name: settings
    label: Site settings & contact
    type: file
    path: src/content/site/settings.yml
    fields:
      - { name: name, label: Lab name, type: string, required: true }
      - { name: short_name, label: Short name (logo), type: string, required: true }
      - { name: tagline, label: Tagline, type: string, required: true }
      - { name: description, label: Search engine description, type: text, required: true, description: Shown by Google under the site name. About 150 characters. }
      - { name: affiliation, label: Affiliation, type: string, required: true }
      - { name: university_name, label: University, type: string, required: true }
      - { name: university_url, label: University website, type: string }
      - { name: pi_name, label: Contact person, type: string, required: true }
      - { name: pi_title, label: Contact person's title, type: string }
      - { name: departments, label: Schools / departments, type: string, list: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: phone, label: Phone, type: string }
      - { name: office, label: Office, type: string }
      - { name: address, label: Mailing address, type: string, required: true }
      - { name: map_query, label: Map location, type: string, description: What to search for on the map. }
      - { name: google_scholar, label: Lab Google Scholar URL, type: string, description: Shows a "View on Google Scholar" button on the Publications page. }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: twitter, label: X / Twitter URL, type: string }
      - { name: social_image, label: Link preview image, type: image, description: Shown when the site is shared on social media or in messages. }
