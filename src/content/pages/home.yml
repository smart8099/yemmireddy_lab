intro: >-
  Located in the Rio Grande Valley, at the heart of the U.S.–Mexico
  fresh-produce corridor, the Yemmireddy Lab investigates how foodborne
  microorganisms survive, adapt, and persist across food supply chains. We
  integrate food microbiology, microbial ecology, postharvest quality,
  intervention science, and quantitative risk assessment to develop practical
  solutions that reduce risk, protect product quality, and support
  evidence-based decisions.


  Through research, training, and outreach, we translate scientific discoveries
  into industry-relevant practices and prepare the next generation of
  food-safety professionals.
mission_title: Our Mission
mission: To understand microbial behavior in food systems, develop effective
  controls, and inform better food-safety decisions.
