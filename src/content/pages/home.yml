intro: |-
  The Yemmireddy Lab investigates how foodborne microorganisms survive, adapt, and respond to environmental stresses, intervention technologies, and ecological interactions across the food supply chain. By integrating food microbiology, microbial ecology, postharvest quality, intervention science, and risk analysis, we develop practical solutions that enhance food safety, preserve product quality, and support evidence-based decision making for industry, regulators, and communities.

  Through research, education, and outreach, we translate scientific discoveries into real-world practices that strengthen food systems and prepare the next generation of food safety professionals.
mission_title: Our Mission
mission: Understand microbial behavior. Develop effective controls. Inform better decisions.
