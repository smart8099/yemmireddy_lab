title: Research
subtitle: Systems Food Microbiology — from Insight to Impact
intro: We study how microorganisms behave across food supply chains, which
  controls work under realistic conditions, and how scientific evidence can
  guide better food-safety decisions.
directions: "Our research follows three connected directions: Understand. Control. Inform."
framework_title: Our Research Framework
framework:
  title: From Insight to Impact
  subtitle: A systems framework for food safety and quality
  system_label: The system we study
  stages:
    - Field & harvest
    - Packing & washing
    - Storage & distribution
    - Decisions & practice
  flow_note: Real-world conditions, evidence, and questions
  core_label: The scientific core
  core_title: Systems Food Microbiology
  core_note: Evidence connects all themes
  areas:
    - name: Understand
      title: Microbial Ecology & Pathogen Persistence
      question: Where and why do foodborne pathogens survive and persist?
    - name: Control
      title: Intervention Science & Food Quality
      question: Which controls work under realistic conditions while protecting
        product quality?
    - name: Inform
      title: Risk Analytics & Decision Support
      question: Which actions deliver the greatest meaningful reduction in risk?
  practice_label: Evidence moves into practice through
  practice:
    - Teaching & Mentoring
    - Training & Outreach
  impact_title: Impact
  impact:
    - Safer foods
    - Protected quality
    - Resilient food systems
  original_image:
    image: ../../assets/images/research/insight-to-impact.png
    alt: "Original infographic: From Insight to Impact, a systems framework linking
      the food system to three research areas — Understand, Control, and Inform
      — around systems food microbiology, leading through teaching, training,
      and outreach to safer foods, protected quality, and resilient food
      systems"
decision_cycle:
  title: From Evidence to Decision
  subtitle: Quantitative microbial risk assessment as an iterative research cycle
  hub_label: The integrating hub
  hub_title: QMRA & Decision Science
  hub_note: Evidence → Risk → Action
  steps:
    - title: Integrate Evidence
      details:
        - Laboratory
        - Field
        - Literature
        - Industry
    - title: Model Exposure
      details:
        - Contamination
        - Transfer
        - Survival
        - Consumption
        - Dose–response
    - title: Quantify Risk
      details:
        - Probability
        - Variability
        - Uncertainty
    - title: Compare Interventions
      details:
        - Scenarios
        - Sensitivity
        - Risk reduction
    - title: Prioritize Decisions
      details:
        - Critical points
        - Practical controls
        - Research needs
  outcomes_label: Outcomes
  outcomes:
    - Targeted controls
    - Better resource allocation
    - Safer food systems
  original_image:
    alt: "Original infographic: From Evidence to Decision, a cycle of integrating
      evidence, modeling exposure, quantifying risk, comparing interventions,
      and prioritizing decisions, centered on QMRA and decision science"
pillars:
  - label: 01 | Understand
    title: Microbial Ecology & Pathogen Persistence
    summary: We study how foodborne pathogens and resident microbial communities
      change across fresh-produce supply chains. Through field sampling,
      laboratory studies, and microbiome and metagenomic analyses, we identify
      environmental and operational conditions that influence contamination,
      survival, and persistence.
    show_decision_cycle: false
    photos:
      - image: ../../assets/images/research/understand-1.jpg
        alt: Rows of onions growing in a field
      - image: ../../assets/images/research/understand-2.jpg
        alt: Researchers sampling leafy greens in a field
      - image: ../../assets/images/research/understand-3.jpg
        alt: Researcher preparing samples at a lab bench
      - image: ../../assets/images/research/understand-4.jpg
        alt: Researchers processing samples in the laboratory
      - image: ../../assets/images/research/understand-5.jpg
        alt: Student pipetting samples inside a biosafety cabinet
  - label: 02 | Control
    title: Intervention Science & Quality Protection
    summary: We investigate how microbial stress, surface attachment, and biofilm
      formation affect pathogen response to control measures. We evaluate
      sanitizers and emerging technologies for their ability to reduce microbial
      risk while protecting product quality and shelf life.
    show_decision_cycle: false
    photos:
      - image: ../../assets/images/research/control-1.jpg
        alt: Researcher treating trays of fresh-cut produce in a biosafety cabinet
      - image: ../../assets/images/research/control-2.jpg
        alt: Laboratory setup for a produce wash intervention study
      - image: ../../assets/images/research/control-3.jpg
        alt: Bacterial colonies growing on an agar plate
      - image: ../../assets/images/research/control-4.jpg
        alt: Selective agar plate with dark bacterial colonies
      - image: ../../assets/images/research/control-5.jpg
        alt: Researcher working with laboratory instruments
      - image: ../../assets/images/research/control-6.jpg
        alt: Student operating an analytical instrument
  - label: 03 | Inform
    title: Quantitative Risk Assessment & Decision Science
    summary: We use quantitative microbial risk assessment (QMRA) to connect
      laboratory, field, and supply-chain data. These models help us estimate
      risk, compare intervention strategies, identify critical knowledge gaps,
      and determine where food-safety actions can have the greatest impact.
    show_decision_cycle: false
    photos:
      - image: ../../assets/images/research/inform-1.jpg
        alt: Lab members discussing research findings at a scientific poster session
closing_title: One Integrated Research Program
closing_text: Understand microbial behavior. Develop effective controls. Inform
  better decisions.
seo_title: Research
seo_description: Systems food microbiology from insight to impact — microbial
  ecology, intervention science, and quantitative microbial risk assessment
  across fresh-produce supply chains.
