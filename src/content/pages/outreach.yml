seo_title: Training & Outreach
seo_description: Food safety education, training, and outreach for growers, food handlers, students, and communities in the Rio Grande Valley.
title: Training & Outreach
subtitle: Education. Empowerment. Evaluation.
# DRAFT TEXT: the source document for this page contained photos only.
