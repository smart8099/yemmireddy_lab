intro: |-
  We translate food safety research into hands-on training for growers, food handlers, students, and community members across the Rio Grande Valley. Our programs combine interactive workshops, field demonstrations, and practical tools that help participants apply food safety practices in their own operations and homes.
feature_photo:
  image: ../../assets/images/outreach/education-empowerment-evaluation.png
  alt: "Three pillars — Education, Empowerment, and Evaluation — supporting sustainable and resilient food safety systems"
highlights:
  - title: Education
    text: Workshops and trainings that build practical food safety knowledge for growers, food handlers, and consumers.
  - title: Empowerment
    text: Hands-on activities and resources that help participants put safe practices to work in their farms, businesses, and communities.
  - title: Evaluation
    text: Measuring the outcomes of our programs to strengthen future training and support resilient food safety systems.
