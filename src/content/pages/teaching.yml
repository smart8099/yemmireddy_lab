title: Teaching
subtitle: Learning Science by Applying It
intro: I design courses that help students move from understanding foundational
  concepts to applying them to meaningful problems in microbiology, food safety,
  and food systems. My teaching emphasizes active participation, evidence-based
  reasoning, collaborative problem-solving, and clear scientific communication.
feature_photo:
  image: ../../assets/images/teaching/classroom-1.jpg
  alt: Students seated in a large lecture hall during class
approach_title: My Teaching Approach
approach:
  - title: Connect
    text: Relate scientific concepts to current cases, practical applications, and
      career-relevant challenges.
  - title: Engage
    text: Involve students through discussion, inquiry, laboratory experiences, and
      collaborative problem-solving.
  - title: Apply
    text: Prepare students to analyze evidence, make informed decisions, and
      communicate scientific conclusions effectively.
