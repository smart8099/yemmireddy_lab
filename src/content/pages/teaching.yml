mentoring_title: Mentoring Beyond the Classroom
mentoring_text: I mentor undergraduate and graduate students through laboratory
  research, collaborative projects, scientific presentations, and manuscript
  development. These experiences help students strengthen their technical
  abilities, scientific judgment, communication skills, and professional
  confidence.
