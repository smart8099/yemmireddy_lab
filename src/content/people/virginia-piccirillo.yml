research_interests: Virginia is interested in microbiology, bacterial control, and the biomedical applications of microbiological research. She is particularly interested in innovative approaches to limiting bacterial growth and in understanding how laboratory research can contribute to improvements in human health.
current_research:
  - Evaluating how antimicrobial treatments and storage conditions affect both pathogen survival and postharvest quality in fresh produce.
  - Monitoring microbial populations alongside quality indicators such as color, texture, weight loss, and visible deterioration to identify treatments that improve safety without compromising shelf life.
outside_the_lab: Enjoys discovering new matcha shops, practicing yoga, traveling, and spending time with friends and family.
