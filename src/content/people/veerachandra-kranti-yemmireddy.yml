research_interests: Dr. Yemmireddy uses a systems food microbiology approach to understand, predict, and control foodborne pathogen persistence across fresh-produce supply chains. His research interests include produce-associated microbial ecology, microbial stress adaptation and biofilms, antimicrobial and postharvest interventions, food quality and shelf life, and quantitative microbial risk assessment. His program also translates research evidence into decision tools, food-safety training, and risk communication for produce stakeholders.
