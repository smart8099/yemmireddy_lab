research_interests: "Dr. Yemmireddy uses a systems food microbiology approach to
  understand, predict, and control foodborne pathogen persistence across
  fresh-produce supply chains. His research interests include produce-associated
  microbial ecology, microbial stress adaptation and biofilms, antimicrobial and
  postharvest interventions, food quality and shelf life, and quantitative
  microbial risk assessment. His program also translates research evidence into
  decision tools, food-safety training, and risk communication for produce
  stakeholders. Also, he is a Lead Instructor for Food Safety Preventive Control
  Alliance (FSPCA) Preventive Controls Qualified Individual (PCQI) and the Food
  Traceability Rule (FTR) training programs. "
