research_interests: >-
  Dr. Veerachandra “Kranti” Yemmireddy is an Associate Professor of Food Safety
  and Microbiology at The University of Texas Rio Grande Valley. His laboratory
  uses a systems food microbiology approach to understand, predict, and control
  foodborne pathogen persistence across fresh-produce supply chains.


  His research spans produce-associated microbial ecology, microbial stress
  adaptation and biofilms, antimicrobial and postharvest interventions, food
  quality and shelf life, and quantitative microbial risk assessment. His
  program translates research evidence into practical interventions,
  decision-support tools, training, and risk communication for produce
  stakeholders. Dr. Yemmireddy is an FSPCA Lead Instructor for the Preventive
  Controls for Human Food and Food Traceability Rule curricula. 
