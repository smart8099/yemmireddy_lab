research_interests: Marcos is interested in applying genomic and metagenomic sequencing to food-safety investigations. His research examines whether the native microbiome of a food commodity can provide useful context for detecting or investigating pathogen contamination. This work focuses on microbial-community dynamics and pathogen persistence in fresh-cut produce.
current_research:
  - Investigating fresh-cut produce microbiome dynamics and pathogen persistence during cold storage.
