research_interests: Cesar is interested in food microbiology and the prevention of bacterial infections. He is particularly interested in understanding how foodborne microorganisms interact with foods and environments and how research can support more effective approaches to contamination prevention and public-health protection.
current_research:
  - Investigating the growth and survival of foodborne pathogens on fresh produce under controlled storage conditions.
  - Evaluating pathogen responses to antimicrobial treatments by measuring changes in microbial populations following intervention.
