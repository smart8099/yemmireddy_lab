research_interests: Dr. Muthukumar works at the intersection of materials science, catalysis, food safety, and sustainability. Her interests include functional and waste-derived materials, photocatalytic and antimicrobial technologies, advanced oxidation processes, and atomic force microscopy. She also applies techno-economic analysis and life-cycle assessment to evaluate the scalability, environmental impact, and practical value of emerging food-safety and water-treatment technologies.
current_research:
  - Examining how environmental stress alters morphology, surface properties, and antimicrobial responses of foodborne pathogens using atomic force microscopy.
  - Characterizing dry-surface biofilms on food-contact materials and evaluating their responses to sanitation interventions.
  - Evaluating postharvest interventions using food-safety, techno-economic, and life-cycle assessment criteria.
outside_the_lab: Enjoys baking, badminton, long drives, exploring different cuisines, sewing, and crocheting.
