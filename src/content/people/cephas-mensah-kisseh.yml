research_interests: Cephas is interested in molecular microbiology, bacterial pathogenesis, antimicrobial resistance, and molecular diagnostics. His clinical laboratory background supports his interest in pathogen detection, genomics, sequencing, bioinformatics, molecular epidemiology, and the application of advanced molecular methods to infectious-disease and public-health research.
current_research:
  - Characterizing changes in fresh-produce microbiomes across production, handling, and storage using metagenomic sequencing and bioinformatic analysis.
  - Investigating how supply-chain conditions shape microbial-community composition and functional potential, including microbiome patterns associated with pathogen persistence, food safety, and product quality.
